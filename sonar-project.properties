sonar.projectKey=hermes-agent-ak_git-fanta-site_1adb4a44-7d52-4ba2-b75b-dded29c382e0
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts
sonar.exclusions=dist/**,coverage/**,node_modules/**,media/**,public/**,test-results/**,playwright-report/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Astro templates and CSS are declarative presentation; their repeated layout
# patterns are validated by Playwright/Axe rather than copy-paste detection.
sonar.cpd.exclusions=src/**/*.astro,src/**/*.css
# Browser-only wiring is covered by Playwright; its pure state transitions are
# unit-tested through the injected root/view contract.
sonar.coverage.exclusions=src/**/*.astro,src/**/*.css
sonar.sourceEncoding=UTF-8
